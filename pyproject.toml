[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "questline"
version = "0.1.0"
description = "AI-native game test automation framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Knutronko" }]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
