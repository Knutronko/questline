[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "questline"
version = "0.1.0"
description = "AI-native game test automation framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Knutronko" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
alttester = [
    "AltTester-Driver>=2.2,<3",
]
poco = []
appium = []
# Slack/GitHub use stdlib urllib; extras document the install surface from the brief.
slack = []
github = []
notion = []
ai = []
hud = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.scripts]
questline = "questline.cli:app"

[project.entry-points.pytest11]
# Name sorts after pytest_cov so coverage starts before this plugin imports package code.
zzz_questline = "questline.authoring.plugin"

[tool.hatch.build.targets.wheel.force-include]
"src/questline/reporters/slack/templates" = "questline/reporters/slack/templates"
"src/questline/hud/static" = "questline/hud/static"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["questline"]
sigterm = true
omit = [
    "*/questline/drivers/port.py",
    "*/questline/devices/port.py",
    "*/questline/reporters/port.py",
    # Lazy package re-exports — exercised via attribute access, not line hits.
    "*/questline/authoring/__init__.py",
    "*/questline/reporters/__init__.py",
    "*/questline/__init__.py",
    # Live AltDriver wrapper — covered via FakeAltTransport in unit tests; real
    # websocket path needs Unity (maintainer-checked / QL-1).
    "*/questline/drivers/alttester/transport.py",
    # Real adb/emulator binaries — covered via FakeAdb; live paths need a device.
    "*/questline/devices/adb/client.py",
    # Live Slack/GitHub HTTP — covered via Fake* transports in unit tests.
    "*/questline/reporters/slack/transport.py",
    "*/questline/reporters/github_issues/transport.py",
    # Documented stubs (NotImplementedError).
    "*/questline/reporters/notion.py",
    "*/questline/reporters/jira.py",
    "*/questline/reporters/testrail.py",
    # Demo seed for Playwright smoke (exercised outside cov gate).
    "*/questline/hud/fixtures.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true

# Authoring-layer gate (phase-03 AC): measured in CI via a dedicated coverage report.
# Overall package fail_under above keeps the suite honest; authoring is checked separately.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=questline",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
