[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "questline"
version = "0.1.0"
description = "AI-native game test automation framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Knutronko" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
alttester = []
poco = []
appium = []
slack = []
notion = []
ai = []
hud = []

[project.scripts]
questline = "questline.cli:app"

[project.entry-points.pytest11]
# Name sorts after pytest_cov so coverage starts before this plugin imports package code.
zzz_questline = "questline.authoring.plugin"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["questline"]
sigterm = true
omit = [
    "*/questline/drivers/port.py",
    # Lazy package re-exports — exercised via attribute access, not line hits.
    "*/questline/authoring/__init__.py",
    "*/questline/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true

# Authoring-layer gate (phase-03 AC): measured in CI via a dedicated coverage report.
# Overall package fail_under above keeps the suite honest; authoring is checked separately.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=questline",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
