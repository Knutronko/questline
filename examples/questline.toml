# Sample questline.toml used by docs, doctor, and the demo suite.

[profile.editor]
driver = "mock"
device = "local"
reporters = ["console"]
wait.probe = 2.0
wait.deadline = 20.0
wait.interval = 0.5

[profile.ci]
driver = "mock"
device = "local"
reporters = ["console"]
log_json = true
wait.probe = 1.0
wait.deadline = 30.0
wait.interval = 0.25

[profile.mock]
driver = "mock"
device = "local"
reporters = ["console"]
markers = ["quest.demo"]
wait.probe = 0.2
wait.deadline = 2.0
wait.interval = 0.05

# Phase-04 AltTester profiles (require questline[alttester] + live Unity target).
[profile.alttester_editor]
driver = "alttester"
target_host = "127.0.0.1"
target_port = 13000
target_platform = "editor"
device = "local"
reporters = ["console"]
wait.probe = 2.0
wait.deadline = 20.0
wait.interval = 0.5
