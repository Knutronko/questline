# Sample questline.toml used by docs, doctor, and the demo suite.

[profile.editor]
driver = "mock"
device = "local"
reporters = ["console", "html"]
wait.probe = 2.0
wait.deadline = 20.0
wait.interval = 0.5

[profile.ci]
driver = "mock"
device = "local"
reporters = ["console", "html"]
log_json = true
wait.probe = 1.0
wait.deadline = 30.0
wait.interval = 0.25

[profile.mock]
driver = "mock"
device = "local"
reporters = ["console", "html"]
markers = ["quest.demo"]
wait.probe = 0.2
wait.deadline = 2.0
wait.interval = 0.05

# Phase-04 AltTester profiles (require questline[alttester] + live Unity target).
[profile.alttester_editor]
driver = "alttester"
target_host = "127.0.0.1"
target_port = 13000
target_platform = "editor"
device = "local"
reporters = ["console", "html"]
wait.probe = 2.0
wait.deadline = 20.0
wait.interval = 0.5

# Phase-05 Android local adb (requires instrumented APK + adb device/emulator).
[profile.android_local]
driver = "alttester"
device = "adb"
target_host = "127.0.0.1"
target_port = 13000
target_platform = "android"
target_app_name = "__default__"
install_apk = true
reporters = ["console", "html"]
wait.probe = 2.0
wait.deadline = 45.0
wait.interval = 0.5
