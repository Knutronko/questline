name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,alttester]"

      - name: Lint
        run: uv run ruff check src/ tests/ examples/demo-tests/ examples/unity-smoke/

      - name: Test
        run: uv run pytest

      - name: Authoring coverage gate
        run: >
          uv run coverage report
          --include="src/questline/authoring/*"
          --omit="src/questline/authoring/__init__.py"
          --fail-under=85

      - name: Demo suite (authoring e2e)
        run: |
          uv run pytest examples/demo-tests \
            --questline-profile mock \
            --questline-config examples/questline.toml \
            --questline-quarantine examples/demo-tests/quarantine.yaml \
            -q -o addopts=

      - name: Quarantine audit (demo ledger)
        run: |
          uv run questline quarantine audit \
            --path examples/demo-tests/quarantine.yaml \
            --tests examples/demo-tests \
            --rootdir .
