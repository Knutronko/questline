name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,alttester,hud]"

      - name: Setup Node (HUD frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build HUD frontend
        working-directory: hud/frontend
        run: |
          npm install
          npm run build

      - name: Lint
        run: uv run ruff check src/ tests/ examples/demo-tests/ examples/unity-smoke/

      - name: Test
        run: uv run pytest

      - name: Authoring coverage gate
        run: >
          uv run coverage report
          --include="src/questline/authoring/*"
          --omit="src/questline/authoring/__init__.py"
          --fail-under=85

      - name: Demo suite (authoring e2e)
        run: |
          uv run pytest examples/demo-tests \
            --questline-profile mock \
            --questline-config examples/questline.toml \
            --questline-quarantine examples/demo-tests/quarantine.yaml \
            -q -o addopts=

      - name: Quarantine audit (demo ledger)
        run: |
          uv run questline quarantine audit \
            --path examples/demo-tests/quarantine.yaml \
            --tests examples/demo-tests \
            --rootdir .

      - name: HUD Playwright smoke
        if: matrix.python-version == '3.12'
        run: |
          cd hud/frontend
          npx playwright install --with-deps chromium
          cd ../..
          uv run python scripts/serve_hud_smoke.py --port 8741 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8741/api/health && break
            sleep 1
          done
          cd hud/frontend
          npx playwright test
        env:
          HUD_BASE_URL: http://127.0.0.1:8741
